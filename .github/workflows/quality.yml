name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python -m pip install -r requirements-quality.txt
      - run: ./scripts/quality
      - run: .agents/skills/verify-prompt-audit/scripts/drive.py
